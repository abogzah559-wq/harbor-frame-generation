[package]
name = "torrentplayer-torrent"
description = "Torrent engines for TorrentPlayer: torrentplayer-swarm and librqbit behind one streaming API."
version = "0.3.3"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["The TorrentPlayer Contributors"]
repository = "https://github.com/torrentplayer/torrentplayer"
publish = false

[dependencies]
bytes = { version = "1.10" }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
torrentplayer-net = { path = "../torrentplayer-net" }
torrentplayer-prioritize = { path = "../torrentplayer-prioritize" }
torrentplayer-stream = { path = "../torrentplayer-stream" }
torrentplayer-swarm = { path = "../torrentplayer-swarm" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tempfile = { version = "3.20" }
thiserror = { version = "2.0.17" }
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["io"] }
tracing = { version = "0.1.41" }
url = { version = "2.5" }

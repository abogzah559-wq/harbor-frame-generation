[package]
name = "torrentplayer-stream"
description = "Stream feeds that serve torrent data to the player."
version = "0.3.3"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["The TorrentPlayer Contributors"]
repository = "https://github.com/torrentplayer/torrentplayer"
publish = false

[dependencies]
bytes = { version = "1.10" }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
getrandom = { version = "0.4" }
http = { version = "1.3" }
http-body-util = { version = "0.1.3" }
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
subtle = { version = "2.6" }
thiserror = { version = "2.0.17" }
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["io"] }
tracing = { version = "0.1.41" }

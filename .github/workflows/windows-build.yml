name: windows-build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a public release with this tag (e.g. boost-2). Leave empty for a test build."
        required: false
        default: ""
  push:
    branches: [main, frame-gen]
    # Pushing a tag like "boost-2" also publishes a public GitHub Release.
    tags: ["boost-*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      HARBOR_FORK_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            harbor-core
            src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Fetch libmpv
        run: pnpm run setup:libmpv

      - name: Fetch fonts
        run: pnpm run setup:fonts

      - name: Fetch mpv.exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src-tauri/binaries
          gh release download 20260610 -R shinchiro/mpv-winbuild-cmake -p "mpv-x86_64-2026*" -O mpv.7z || \
            gh release download -R shinchiro/mpv-winbuild-cmake -p "mpv-x86_64-2*" -O mpv.7z
          7z x -y mpv.7z -ompv-bin > /dev/null
          cp "$(find mpv-bin -name mpv.exe | head -1)" src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe
          rm -rf mpv.7z mpv-bin

      - name: Fetch external binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries
          T=x86_64-pc-windows-msvc
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "yt-dlp-$T.exe"
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          unzip -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
          mv ffmpeg.exe "ffmpeg-$T.exe"
          mv ffprobe.exe "ffprobe-$T.exe"

      - name: Tauri build
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          NO_COLOR: "1"
        run: |
          set -o pipefail
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis 2>&1 | tee build.log || {
            sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' build.log > clean.log
            { grep -nE -A14 '(^|\s)error(\[E[0-9]+\])?:' clean.log | head -160; echo '----- tail -----'; tail -40 clean.log; } > err.txt
            msg=$(sed 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=build::${msg}"
            exit 1
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: harbor-windows-framegen
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/boost-') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Harbor Boost ${{ inputs.release_tag || github.ref_name }}
          body_path: docs/BOOST.md
          files: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

name: windows-build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a public release with this tag (e.g. boost-2). Leave empty for a test build."
        required: false
        default: ""
  push:
    branches: [main, frame-gen]
    # Pushing a tag like "boost-2" also publishes a public GitHub Release.
    tags: ["boost-*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      HARBOR_FORK_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            harbor-core
            src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Fetch libmpv
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The upstream harborstremio/harbor release that hosted libmpv-2.dll is
          # gone. Take the same verified DLL out of our boost-2 installer; the
          # setup script still checks its SHA-256.
          if ! pnpm run setup:libmpv; then
            gh release download boost-2 -R "${{ github.repository }}" -p "*.exe" -O old-setup.exe
            7z e -y -r old-setup.exe libmpv-2.dll -olibmpv-old > /dev/null
            mkdir -p src-tauri/libmpv
            cp libmpv-old/libmpv-2.dll src-tauri/libmpv/libmpv-2.dll
            rm -rf old-setup.exe libmpv-old
            pnpm run setup:libmpv
          fi

      - name: Fetch fonts
        run: pnpm run setup:fonts

      - name: Fetch mpv.exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shinchiro prunes old releases, so always take the newest build.
          # Newer builds link LuaJIT dynamically: mpv.exe needs lua51.dll next
          # to it, otherwise Windows shows "lua51.dll was not found" whenever
          # Harbor starts the bundled mpv.exe (thumbnails, clips).
          mkdir -p src-tauri/binaries
          gh release download -R shinchiro/mpv-winbuild-cmake -p "mpv-x86_64-2*" -O mpv.7z
          7z x -y mpv.7z -ompv-bin > /dev/null
          exe="$(find mpv-bin -name mpv.exe | head -1)"
          dir="$(dirname "$exe")"
          ls -la "$dir"
          cp "$exe" src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe
          mkdir -p src-tauri/binaries/mpv-deps mpv-fix
          cp "$exe" mpv-fix/mpv.exe
          for d in "$dir"/*.dll; do
            [ -e "$d" ] || continue
            cp "$d" src-tauri/binaries/mpv-deps/
            cp "$d" mpv-fix/
          done
          ls -la src-tauri/binaries/mpv-deps
          python - <<'PY'
          import json, os
          p = "src-tauri/tauri.windows.conf.json"
          c = json.load(open(p))
          r = c["bundle"]["resources"]
          for f in sorted(os.listdir("src-tauri/binaries/mpv-deps")):
              r["binaries/mpv-deps/" + f] = f
          json.dump(c, open(p, "w"), indent=2)
          print(json.dumps(r, indent=2))
          PY
          rm -rf mpv.7z mpv-bin

      - name: Check mpv.exe has its DLLs
        shell: pwsh
        run: |
          # Fails the build if mpv.exe imports a DLL that is neither bundled
          # next to it nor part of Windows / the GPU driver.
          python .github/scripts/pe_imports.py mpv-fix/mpv.exe
          if ($LASTEXITCODE -ne 0) { throw "mpv.exe is missing DLLs" }
          Compress-Archive -Path mpv-fix/* -DestinationPath mpv-fix-x64.zip -Force

      - name: Fetch external binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries
          T=x86_64-pc-windows-msvc
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "yt-dlp-$T.exe"
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          unzip -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
          mv ffmpeg.exe "ffmpeg-$T.exe"
          mv ffprobe.exe "ffprobe-$T.exe"

      - name: Tauri build
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          NO_COLOR: "1"
        run: |
          set -o pipefail
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis 2>&1 | tee build.log || {
            sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' build.log > clean.log
            { grep -nE -A14 '(^|\s)error(\[E[0-9]+\])?:' clean.log | head -160; echo '----- tail -----'; tail -40 clean.log; } > err.txt
            msg=$(sed 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=build::${msg}"
            exit 1
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: harbor-windows-framegen
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            mpv-fix-x64.zip
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/boost-') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Harbor Boost ${{ inputs.release_tag || github.ref_name }}
          body_path: docs/BOOST.md
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            mpv-fix-x64.zip

name: quick-check
on:
  push:
    branches: ["check-*"]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc
        run: npx tsc -b 2>&1 | tee tsc.log; test ${PIPESTATUS[0]} -eq 0
      - name: vite build
        run: npx vite build 2>&1 | tail -30
      - name: errors
        if: failure()
        run: |
          msg=$(head -80 tsc.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=tsc::${msg}"
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev libssl-dev pkg-config libsoup-3.0-dev libjavascriptcoregtk-4.1-dev > /dev/null
      - name: stubs
        run: |
          mkdir -p src-tauri/binaries dist
          for b in yt-dlp ffmpeg ffprobe; do touch src-tauri/binaries/$b-x86_64-unknown-linux-gnu; chmod +x src-tauri/binaries/$b-x86_64-unknown-linux-gnu; done
          echo '<html></html>' > dist/index.html
      - name: cargo check
        run: |
          cd src-tauri
          set -o pipefail
          cargo check --message-format short 2>&1 | tee ../cargo.log
      - name: errors
        if: failure()
        run: |
          msg=$(grep -E "error|warning: unused" cargo.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=cargo::${msg}"

name: scene-cut-test

on:
  workflow_dispatch:
  push:
    branches: [fix-motion]
    paths: ["src-tauri/src/boost.rs", ".github/scripts/sc_*.py", ".github/workflows/sc-test.yml"]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runtime (same steps as Harbor's installer)
        shell: bash
        run: |
          curl -sSL https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip -o py.zip
          curl -sSL https://github.com/vapoursynth/vapoursynth/releases/download/R79/VapourSynth64-Portable-R79.zip -o vs.zip
          mkdir rt stg && unzip -q py.zip -d rt && unzip -q vs.zip -d stg
          printf 'Lib\\site-packages\r\n' >> rt/python312._pth
          cat rt/python312._pth
          mkdir -p rt/Lib/site-packages
          unzip -q -o stg/wheel/*.whl -d rt/Lib/site-packages
          python -m pip install numpy --target rt/Lib/site-packages -q
          ./rt/python.exe -c "import vapoursynth as vs, numpy; print(vs.core.version())"
      - name: Videos
        shell: bash
        run: |
          curl -sSL https://download.blender.org/durian/trailer/sintel_trailer-1080p.mp4 -o v1.mp4
          curl -sSL "https://download.blender.org/demo/movies/BBB/bbb_sunflower_1080p_30fps_normal.mp4" -o v2.mp4 || true
          choco install ffmpeg -y --no-progress > /dev/null
          ls -la *.mp4
      - name: Run detector
        shell: bash
        run: |
          mkdir -p res
          for v in v1 v2; do
            [ -s $v.mp4 ] || continue
            ffmpeg -loglevel error -i $v.mp4 -t 120 -vf "scale=64:36:flags=bilinear,format=grayf32le" -f rawvideo $v.gray || continue
            nf=$(( $(stat -c %s $v.gray) / (64*36*4) ))
            ffmpeg -i $v.mp4 -t 120 -vf "scdet=t=10,metadata=print:file=res/$v.scdet.txt" -f null - 2> /dev/null || true
            ./rt/python.exe .github/scripts/sc_test.py src-tauri/src/boost.rs $v.gray $nf res/$v
            fps=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 $v.mp4 | python -c "import sys;a,b=sys.stdin.read().split('/');print(int(a)/int(b))")
            python .github/scripts/sc_report.py res/$v res/$v.scdet.txt res/$v.txt $fps
            # a strip of frames f-1..f+2 for each frame to check by eye
            mkdir -p res/$v/s
            for f in $(cat res/$v.txt.show); do
              ffmpeg -loglevel error -i $v.mp4 -t 120 -vf "select='between(n\,$((f-1))\,$((f+2)))',scale=200:-2,tile=4x1" -frames:v 1 -y res/$v/s/$(printf %05d $f).jpg
            done
          done
      - name: Push results to the sc-results branch
        shell: bash
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          mkdir -p /tmp/out && cp -r res/*.txt /tmp/out/ && for v in v1 v2; do [ -d res/$v/s ] && mkdir -p /tmp/out/$v && cp res/$v/s/*.jpg /tmp/out/$v/ || true; done
          git checkout --orphan sc-results && git rm -rqf . && cp -r /tmp/out/* . && git add -A && git commit -qm "scene-cut results ${{ github.sha }}" && git push -f origin sc-results
      - uses: actions/upload-artifact@v4
        with:
          name: sc-results
          path: res
          retention-days: 3
